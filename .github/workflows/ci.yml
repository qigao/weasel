name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '[0-9]+.*'
  pull_request:
  workflow_dispatch:

# PR and branch pushes for the same head share one qualification group.
concurrency:
  group: weasel-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      SDKVER: 10.0.19041.0
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          fetch-depth: 0

      - name: Verify source and OpenWTL release pin
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SOURCE_SHA) {
            throw "Unexpected source commit: $actual"
          }
          $expected = '311b2dc361eea42cf6c821289133a99713298a74'
          $actual = git -C external/OpenWTL rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
            throw "Unexpected OpenWTL 0.1.2 commit: $actual"
          }
          Write-Output "WEASEL_SOURCE_OK commit=$env:EXPECTED_SOURCE_SHA OpenWTL=0.1.2 commit=$actual"

      - name: Fetch all tags
        run: git fetch --tags

      - name: Configure build environment
        shell: bash
        run: |
          cp env.vs2022.bat env.bat
          echo git_ref_name="$(git describe --always)" >> $GITHUB_ENV

      # Inherited MSVC build is transitional until Weasel #7 moves
      # the real application to OpenWTL::WTL / llvm-mingw.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: ${{ env.SDKVER }}

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\install_boost.bat source-only
          if ($LASTEXITCODE -ne 0) { throw "Boost source acquisition failed" }
          & .\build.bat boost arm64 native
          if ($LASTEXITCODE -ne 0) { throw "Boost native x64/ARM64 compilation failed" }

      # bundled winsparkle v0.9.2 to disable auto open ReleaseNoteUrl in default browser
      - name: cache bundled winsparkle
        id: cache-winsparkle
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.dll
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.lib
          key: ${{ runner.os }}-winsparkle-v0.9.2-bundled
          restore-keys: |
            winsparkle-v0.9.2-bundled

      - name: Build bundled winsparkle
        if: steps.cache-winsparkle.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path winsparkle) { Remove-Item -Recurse -Force winsparkle }
          # Clone winsparkle repo v0.9.2
          git clone https://github.com/vslavik/winsparkle.git -b v0.9.2 --depth 1
          cd winsparkle
          git submodule update --init --recursive
          copy ..\bundled_winsparkle.patch .
          git apply bundled_winsparkle.patch
          nuget restore
          msbuild -m -t:Build -p:Configuration=Release -p:Platform=x64 WinSparkle.sln

      - name: Install WinSparkle files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          copy .\winsparkle\x64\Release\WinSparkle.dll .\output\
          copy .\winsparkle\x64\Release\WinSparkle.lib .\lib64\

      - name: Get Rime files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-rime.ps1 -use dev

      - name: Build data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat data

      - name: Build Weasel
        shell: pwsh
        id: build_weasel
        env:
          RELEASE_BUILD: ${{ (github.repository == 'rime/weasel' && startsWith(github.ref, 'refs/tags/')) && '1' || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\build.bat arm64 native weasel
          if ($LASTEXITCODE -ne 0) {
            throw "Weasel native MSBuild failed with exit $LASTEXITCODE"
          }
          $product = '.\output\weaselx64.dll'
          if (-not (Test-Path -LiteralPath $product -PathType Leaf)) {
            throw "Weasel native MSBuild returned success but did not produce $product"
          }

      - name: Validate native TSF COM Server (Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cl.exe /nologo /std:c++17 /EHsc /W4 /WX test\tsf_com_server_test.cpp /Fe:tsf_com_server_test.exe
          if ($LASTEXITCODE -ne 0) { throw "TSF COM Server test compilation failed" }
          $dll = (Resolve-Path '.\output\weaselx64.dll').Path
          & .\tsf_com_server_test.exe $dll
          if ($LASTEXITCODE -ne 0) { throw "TSF COM Server native runtime failed" }

      - name: Validate TSF host exception filter (Windows x64 runtime)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & cl.exe /nologo /std:c++17 /EHsc /W4 /WX test\tsf_host_filter_test.cpp /Fe:tsf_host_filter_test.exe
          if ($LASTEXITCODE -ne 0) { throw "TSF host-filter test compilation failed" }
          $dll = (Resolve-Path '.\output\weaselx64.dll').Path
          & .\tsf_host_filter_test.exe $dll
          if ($LASTEXITCODE -ne 0) { throw "TSF host-filter runtime acceptance failed" }

      - name: Upload native binaries and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: weasel-artifact-${{ env.git_ref_name }}
          if-no-files-found: error
          path: |
            .\output\weasel*.dll
            .\output\weaselserver.exe
            .\output\*.pdb

      # The x64 graph uses the same acquired Rime/patched WinSparkle bundle as
      # MSBuild above. CTest loads the CMake graph's own TSF DLL.
      - name: Build CMake applications, TSF and Setup (Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --preset msvc-x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake x64 configure failed' }
          cmake --build --preset msvc-x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake x64 product build failed' }
          ctest --preset msvc-x64 --verbose
          if ($LASTEXITCODE -ne 0) { throw 'CMake x64 tests failed' }
          cmake --build --preset install-msvc-x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake x64 staging failed' }

      - name: Build CMake TSF and Setup (Windows ARM64 cross compile)
        shell: cmd
        run: |
          set "WEASEL_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALLDIR%Common7\Tools\VsDevCmd.bat" -arch=arm64 -host_arch=x64
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%WEASEL_VCPKG_ROOT%"
          cmake --preset msvc-arm64
          if errorlevel 1 exit /b 1
          cmake --build --preset msvc-arm64
          if errorlevel 1 exit /b 1
          cmake --build --preset install-msvc-arm64
          if errorlevel 1 exit /b 1

      - name: Fetch LLVM-MinGW release used by OpenWTL 0.1.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'weasel-llvm-mingw.zip'
          $root = Join-Path $env:RUNNER_TEMP 'weasel-llvm-mingw'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip' -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') {
            throw "LLVM-MinGW checksum mismatch: $actual"
          }
          Expand-Archive $archive -DestinationPath $root
          $compiler = Get-ChildItem $root -Recurse -Filter x86_64-w64-mingw32-clang++.exe | Select-Object -First 1
          if (-not $compiler) { throw 'LLVM-MinGW compiler is missing' }
          "OPENATL_LLVM_MINGW_BIN=$($compiler.Directory.FullName.Replace('\', '/'))" | Out-File $env:GITHUB_ENV -Append
          $sdkVersion = $env:WindowsSDKVersion.TrimEnd('\')
          $sdkBin = Join-Path $env:WindowsSdkDir "bin/$sdkVersion/x64"
          if (-not (Test-Path (Join-Path $sdkBin 'rc.exe'))) { throw 'Selected Windows SDK resource compiler is missing' }
          "WEASEL_WINDOWS_SDK_BIN=$($sdkBin.Replace('\', '/'))" | Out-File $env:GITHUB_ENV -Append

      - name: Build LLVM-MinGW x64 applications and ARM64 TSF and Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($preset in @('llvm-x64', 'llvm-arm64')) {
            cmake --preset $preset
            if ($LASTEXITCODE -ne 0) { throw "$preset configure failed" }
            cmake --build --preset $preset
            if ($LASTEXITCODE -ne 0) { throw "$preset product build failed" }
            if ($preset -eq 'llvm-x64') {
              ctest --preset $preset --verbose
              if ($LASTEXITCODE -ne 0) { throw "$preset native tests failed" }
            }
            cmake --build --preset "install-$preset"
            if ($LASTEXITCODE -ne 0) { throw "$preset staging failed" }
          }

      - name: Upload CMake products
        uses: actions/upload-artifact@v4
        with:
          name: weasel-cmake-${{ env.git_ref_name }}
          if-no-files-found: error
          path: |
            build/install/msvc-x64/*
            build/install/msvc-arm64/*
            build/install/llvm-x64/*
            build/install/llvm-arm64/*

      - name: Upload parser test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weasel-parser-tests-${{ env.git_ref_name }}
          if-no-files-found: ignore
          path: build/*/test/TestResponseParser/response-parser.xml
